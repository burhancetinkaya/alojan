[project]
name = "alojan-tts"
version = "0.1.0"
description = "Persistent bounded EMA speech worker"
requires-python = ">=3.12,<3.13"
dependencies = ["ema-lightning==1.1.2", "torch==2.6.0+cu124", "grpcio==1.78.0", "grpcio-health-checking==1.78.0", "protobuf==6.33.5"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
