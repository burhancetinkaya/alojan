# OUT-02. Enable only on a node with a qualified carrier account and private spool.
services:
  gateway:
    secrets: [outbound_sip_env]
    environment:
      ALOJAN_OUTBOUND_SIP_ENV: /run/secrets/outbound_sip_env
      ALOJAN_OUTBOUND_DIR: /run/alojan-outbound
    volumes:
      - ${ALOJAN_STATE_DIR}/outbound-spool:/run/alojan-outbound
  outbound-worker:
    image: alojan-outbound-worker:${ALOJAN_RELEASE:-local}
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: python
      args: { SERVICE: voice-preparer }
    user: "${ALOJAN_UID:-1000}:${ALOJAN_GID:-1000}"
    init: true
    read_only: true
    restart: unless-stopped
    network_mode: host
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      ALOJAN_OUTBOUND_DIR: /run/alojan-outbound
    volumes:
      - ${ALOJAN_STATE_DIR}/outbound-spool:/run/alojan-outbound
    secrets: [outbound_worker_env]
    command: [uv, run, --frozen, --no-sync, --project, services/voice-preparer, --env-file, /run/secrets/outbound_worker_env, python, -m, alojan.outbound_worker]
    tmpfs: ["/tmp:size=32m,mode=1777"]
secrets:
  outbound_sip_env:
    file: ${ALOJAN_STATE_DIR}/outbound-sip.env
  outbound_worker_env:
    file: ${ALOJAN_STATE_DIR}/outbound-worker.env
