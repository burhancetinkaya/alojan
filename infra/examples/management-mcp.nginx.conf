# MCP-06: Cloudflare Tunnel origin; listener is never publicly bound.
# Requires application origin the privately configured application origin and token authentication.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 128k;
    server {
        listen 127.0.0.1:13080;
        server_name YOUR_DEPLOYMENT_HOST;
        location = /mcp {
            proxy_pass http://127.0.0.1:18082;
            proxy_http_version 1.1;
            proxy_set_header Host YOUR_DEPLOYMENT_HOST;
            proxy_buffering off;
            proxy_read_timeout 30s;
        }
        # Provider OAuth codes must not appear in upstream-error request URLs.
        location = /mcp-donus {
            error_log /dev/null crit;
            proxy_pass http://127.0.0.1:13000;
            proxy_set_header Host YOUR_DEPLOYMENT_HOST;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / {
            proxy_pass http://127.0.0.1:13000;
            proxy_set_header Host YOUR_DEPLOYMENT_HOST;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
