[project]
name = "alojan-dev"
version = "0.1.0"
description = "Local development and contract tests for Alojan"
requires-python = ">=3.12,<3.13"
dependencies = ["grpcio==1.78.0", "protobuf==6.33.5", "psycopg[binary]==3.2.6"]

[dependency-groups]
dev = [
    "openai-agents==0.24.0",
    "grpcio-health-checking==1.78.0",
    "cmake==3.31.6",
    "ninja==1.11.1.3",
    "pytest==8.3.5",
    "ruff==0.11.2",
    "grpcio-tools==1.78.0",
    "clang-format==20.1.8",
    "pre-commit==4.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["services/agent", "services/tts", "services/asr", "services/app-api", "services/voice-contracts", "generated/python", "tests"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["generated", ".local", "build"]
