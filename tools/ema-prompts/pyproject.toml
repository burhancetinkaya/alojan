[project]
name = "alojan-ema-prompts"
version = "0.1.0"
description = "Offline EMA prompt generation on the authorized Linux GPU host"
requires-python = ">=3.12,<3.13"
dependencies = ["ema-lightning==1.1.2", "torch==2.6.0+cu124"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
